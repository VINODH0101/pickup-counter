services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pickup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickup_password}
      POSTGRES_DB: ${POSTGRES_DB:-pickup_counter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pickup_user} -d ${POSTGRES_DB:-pickup_counter}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - db
          - postgres

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-pickup_user}:${POSTGRES_PASSWORD:-pickup_password}@db:5432/${POSTGRES_DB:-pickup_counter}}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-pickup_counter_dev_webhook_secret_key}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER:-pickup_user}:${POSTGRES_PASSWORD:-pickup_password}@db:5432/pickup_counter_test
      PAYMENT_WEBHOOK_SECRET: pickup_counter_test_webhook_secret_key
    command: npm test

volumes:
  postgres_data:
